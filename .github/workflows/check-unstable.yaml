jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: "unstable"
            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  cache: false
                  node-version-file: .node-version
                  version: 12
            - name: Install dependencies
              run: pnpm ci
            - name: Disable telemetry collection by Astro
              run: pnpm telemetry:disable
            - name: Lint
              run: |
                  pnpm check:lint
                  pnpm check:spell
    test:
        needs: [lint]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: "unstable"
            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  cache: false
                  node-version-file: .node-version
                  version: 12
            - name: Install dependencies
              run: pnpm ci
            - name: Install browsers for running tests in the browser
              run: pnpm exec playwright install
            - name: Disable telemetry collection by Astro
              run: pnpm telemetry:disable
            - name: Test
              run: pnpm test
    browser-test:
        needs: [lint, test]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: "unstable"
            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  cache: false
                  node-version-file: .node-version
                  version: 12
            - name: Install dependencies
              run: pnpm ci
            - name: Install browsers for running tests in the browser
              run: pnpm exec playwright install
            - name: Disable telemetry collection by Astro
              run: pnpm telemetry:disable
            - name: Test
              run: pnpm test:browser
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
    build:
        needs: [lint, test, browser-test]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: "unstable"
            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  cache: false
                  node-version-file: .node-version
                  version: 12
            - name: Install dependencies
              run: pnpm ci
            - name: Disable telemetry collection by Astro
              run: pnpm telemetry:disable
            - name: Lint
              run: pnpm build
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
name: Check unstable
"on":
    push:
        branches: [unstable]
